[pytest]
# Checkpoint 4. Runs on a laptop CPU in seconds -- no GPU, no real
# dataset, no network. The synthetic fixture in tests/conftest.py is
# twelve users and twenty-five items, built through the real RecDataset
# and the real registry.
#
#     pip install pytest
#     python -m pytest
#
# `pythonpath = .` puts the repo root on sys.path so `import src...`
# resolves without an editable install; tests/conftest.py also inserts
# it, so either mechanism alone is enough.
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
