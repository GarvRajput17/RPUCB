# Shared configuration for every run in the matrix.
#
# §5 locks hyperparameters as "shared fixed (d=64, K_max=7, max_hist_len=50);
# only beta tuned, on validation only". Everything that is genuinely shared
# therefore lives here and nowhere else -- a dataset or model file that tries
# to override one of these is rejected by the loader (src/config.py), which is
# what structurally prevents a repeat of the pre-refactor
# `citeulike.yaml: beta: 0.05` silent per-dataset override.
#
# Merge order: base.yaml -> datasets/<name>.yaml -> models/<key>.yaml -> CLI.
# The fully resolved result is written into every checkpoint and every results
# JSON (§6), so what actually ran is auditable without re-deriving the merge.

# ---- capacity ---------------------------------------------------------
embed_dim: 64                       # d
K: 7                                # DCM fixed interest count (Pinterest Table 6)
max_hist_len: 50                    # history bag cap for routing

# ---- DeepCF branches --------------------------------------------------
# rl_layers[-1] must equal embed_dim: the d-dim RP-UCB mask is applied to the
# CFNet-rl branch output as well as the ML embeddings. deepcf_rpucb.py asserts
# this rather than letting the shapes agree by coincidence.
#
# DEVIATION, for the §9 register: pre-refactor, AMusic and citeulike used
# rl_layers/ml_layers of [1024, 512, 64] because both have far more items than
# users, while ml-1m used [512, 256, 128, 64]. §5 locks hyperparameters as
# shared-fixed across datasets, so all five now use the ml-1m shape. This does
# change DeepCF's branch capacity on AMusic and citeulike-a relative to the
# mid-semester numbers -- deliberate, but not free, and it is a reason not to
# read a dataset-to-dataset DeepCF difference as purely a data effect.
rl_layers: [512, 256, 128, 64]
ml_layers: [512, 256, 128, 64]
attn_heads: 2

# ---- Pinterest / MIND towers -----------------------------------------
summarization_hidden: 256
n_fields: 4
n_heads_dhen: 2
transformer_layers: 2
routing_iters: 3
label_aware_power: 2.0              # MIND label-aware attention temperature

# ---- RP-UCB mask ------------------------------------------------------
gamma_init: 2.0                     # sigmoid(2.0) ~ 0.88: exploration active from step one
mask_init: 0.5                      # sigmoid(w) at init. See rpucb_mask.py --
                                    # 0.5 with both-sides masking starts a dense
                                    # user/item pair at 0.25x the unmasked control.
                                    # Set near 1.0 for a parity-start robustness run.
beta: 1.0                           # default only; tuned per family in models/*.yaml
lambda_l1: 0.0001

# ---- optimisation (§5) ------------------------------------------------
lr: 0.001
lr_min: 0.00001
optimizer: adam                     # Adam + cosine schedule
dropout: 0.0
num_negatives: 8

# ---- training / early stopping (§5) -----------------------------------
max_epochs: 100
patience: 10
min_delta: 0.0001

# Which val metric early stopping watches. §5 locks HR@10, and that is kept
# as the default, but the first-light run showed why it is worth revisiting:
# under full-catalog evaluation HR@10 yields 5-40 hits per 1,000 users, so
# it moves in steps of 0.001 with a binomial standard deviation of about 4
# hits, while min_delta is 0.0001 -- a tenth of one hit. Best-epoch
# selection is then substantially noise-driven. HR@100 carries roughly six
# times the hits at no extra cost, since it is already computed.
early_stopping_metric: HR@10

# Users per per-epoch val pass. null means the full val set, which is worth
# using wherever it is small (lastfm and AMusic have under 1,800 val users,
# so the "cheap subsample" saves almost nothing and costs precision).
val_subsample_size: 1000

# ---- dataloader -------------------------------------------------------
# 8 workers is wrong on a laptop and inside WSL, where the shared-memory
# limit surfaces as workers dying mid-epoch. pin_memory: null means "on iff
# CUDA/HIP is available", so a CPU run stops emitting the warning.
num_workers: 8
pin_memory: null

# Adam keeps two moments per parameter, so storing optimizer state triples
# every checkpoint -- 108.7 MB instead of ~36 MB for DeepCF on AMusic --
# and nothing reads it back: --skip-existing resumes at run granularity and
# a killed run restarts from epoch 0. Turn on only with a real resume path.
checkpoint_optimizer_state: false

# ---- evaluation -------------------------------------------------------
user_batch_size: 64
item_encode_chunk: 8192
pair_chunk: 262144

# How a positive that ties with other items is ranked. "mid" is the
# expected rank under random tie-breaking, and is the default because the
# alternative silently rewards artifacts: items with no train interactions
# all receive one shared embedding, and for MIND a user with no train
# history makes every item score exactly 0.0. Under "optimistic" both are
# free rank-1 hits -- 43 of them on AMusic, 65% of MIND's first-light
# HR@10. Cold fractions rise with sparsity (0% on lastfm to 30% on AToy),
# so the artifact would grow along the same axis as the central
# hypothesis. Run "optimistic" only as a sensitivity check: the gap
# between it and "mid" measures the artifact.
tie_policy: mid                     # mid | optimistic | pessimistic
tie_atol: 0.000001                  # tolerance, not ==: identical inputs can
                                    # differ by an ulp across matmul chunks

# Score every split by train popularity as well, as a non-personalised
# floor. Model-free and cheap; a model that cannot beat it is not
# personalising.
popularity_reference: true

# ---- seeds ------------------------------------------------------------
base_seed: 42                       # runs use base_seed .. base_seed + runs - 1

# ---- loss -------------------------------------------------------------
# Native per family (§3); LOSS_FAMILY in src/losses.py is authoritative.
# Set to "bpr" for the §3 robustness check across all families.
loss_override: null