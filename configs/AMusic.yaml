dataset: AMusic
data_path: data/AMusic
num_negatives: 8
batch_size: 64
epochs: 25
lr: 0.001
embed_dim: 64
rl_layers: [1024, 512, 64]      # AMusic has more items than users; wider early layers
ml_layers: [1024, 512, 64]
attn_heads: 2
attn_dim: 64
lambda_l1: 0.0001
dropout: 0.0
seed: 42

# Pinterest-family settings
K: 7
max_hist_len: 50
summarization_hidden: 256
n_fields: 4
n_heads_dhen: 2
transformer_layers: 2
routing_iters: 3